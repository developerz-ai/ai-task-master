name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bun:
    name: bun (test + lint)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: install
        # --frozen-lockfile: the tracked lockfile is the resolution, so a
        # dependency published after it cannot break this run.
        run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: import cycles
        # madge runs from its own isolated install, never the workspace tree: its TS parser
        # (typescript-estree) needs the TypeScript JS API, which typescript@7 no longer ships.
        # As a workspace devDep the root `typescript` override forced it onto 7 and it crashed
        # with "Cannot read properties of undefined (reading 'Cjs')".
        run: bunx madge@8.0.0 --circular packages/*/src

      - name: typecheck
        run: bun run typecheck

      # Typecheck the test files too (they're excluded from the main `typecheck` build),
      # so a test that drifts from package source — a removed export, a changed contract —
      # fails CI instead of only surfacing at runtime. See issue #101.
      - name: typecheck (tests)
        run: bun run typecheck:tests

      # No `bun test` here: the suite is authored against `node:test`, and Bun's
      # node:test shim mis-handles it when many files run together — an async test
      # in one file leaks context into the next, so Bun throws "test() inside
      # another test()" on top-level tests (oven-sh/bun#5090). It's ordering-
      # dependent and unfixable from our side. The `node` + `integration` jobs are
      # the authoritative test runners. Bun still guards install + lint + typecheck.

  node:
    name: node (test + lint)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # The install comes from the tracked lockfile, so a dependency published
      # after it cannot turn this job red on an unrelated push. The job still
      # RUNS under node — that is the point of the job; the runner is what the
      # lockfile decides, not the tool that installs it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: lint
        run: npm run lint

      # Per-workspace (npm), so the Node job never shells out to bun — the root
      # typecheck/test:node scripts delegate via `bun run --filter`.
      - name: typecheck
        run: npm run typecheck --workspaces

      # Unit tests only (src/**). The slower real-git integration suite runs in
      # the separate `integration` job below so unit failures surface fast and
      # neither job crowds the other's timeout budget.
      - name: test
        run: npm run test:node --workspaces

  integration:
    name: integration (node, real git)
    runs-on: ubuntu-22.04
    # Drives real git worktrees/pools end-to-end — slower than unit tests, so a
    # roomier budget than the 10-min unit jobs. e2e-smoke self-skips without secrets.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # The install comes from the tracked lockfile, so a dependency published
      # after it cannot turn this job red on an unrelated push. The job still
      # RUNS under node — that is the point of the job; the runner is what the
      # lockfile decides, not the tool that installs it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: integration tests
        run: npm run test:integration -w @developerz.ai/aitm

