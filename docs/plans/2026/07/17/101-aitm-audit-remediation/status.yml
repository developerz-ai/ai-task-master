notes: "Findings from a 5-agent parallel deep-dive audit (2026-07-17). Clean: no command-injection (execa argv throughout), no Bun-only shipped APIs, no any/as-unknown-as. Product stance drives severity: non-interactive autonomous multi-agent team on ONE shared in-place checkout + one .ai-task-master state dir (worktrees removed, commit 7572a96), driving GH PRs/CI. OPEN DECISION before 02: serialize editing on the shared checkout (assumed) vs restore per-group isolation. Owner-clarified review model: self-review + verify run BEFORE the PR opens, NOT per-commit (intentional, for speed; CI is the post-PR net). Post-PR review comments (CodeRabbit etc.) are optional/repo-dependent — do not build out, but DO keep the prompt-injection fence (01) since a third-party bot's comment feeds a bash/write-tool subagent. Do NOT reintroduce per-commit verification in slice 05. Architecture principle: two kinds of logic — code/harness (deterministic) vs agent/logic-eng (prompts); keep separate + reusable; slice 08 makes the prompt-template boundary that seam and underpins 01+05."
