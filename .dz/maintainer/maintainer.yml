# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy: developerz-ai/ai-task-master
#
# AI-maintained: the agent triages, answers, reviews, closes what has stalled and merges on green,
# for everyone and for the dependency bots. Releases follow the work: see `.dz/briefs/release-due.md`.
version: 1

tone:
  voice: friendly
  language: en

triage:
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question, docs]
  close_unanswered_repro_after_days: 14
  stale_after_days: 30
  stale_action: comment_then_close
  non_goals:
    - "Mailbox or inbox features"
    - "Exposing aitm as an MCP server: it is only an MCP client"
    - "Webhooks or inbound HTTP, beyond loopback OAuth redirects for MCP server authentication"
    - "Docker, devcontainers or any containerization"
    - "An Anthropic SDK dependency or OAuth credential reuse: inference goes through OpenRouter-compatible providers"
    - "Legacy paths kept behind a flag, an optional field, a fallback branch or a rename alias"
    - "Outside human contributors' changes to CI, release or publish automation (.github/, PUBLISHING.md): members own that pipeline"

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit]
  # Named so the agent knows which red check is the author's to fix. Re-check against the
  # repo's ruleset and `.github/workflows/` when either changes; this list is not the ruleset.
  required_checks:
    - "bun (test + lint)"
    - "node (test + lint)"
    - "integration (node, real git)"
  auto_merge: true
  auto_merge_scope: any
  require_review: true
  close_awaiting_author_after_days: 21

review:
  force: true # CodeRabbit is active here; without this the native review defers forever

release:
  # `none`: there is no release manager. Empty channels: the agent publishes nothing itself.
  # Publishing a GitHub Release runs release.yml, which publishes to npm. See `.dz/briefs/release-due.md`.
  manager: none
  channels: []

escalate:
  # Empty: nothing beyond the platform's hardcoded asks (security, license, CLA).
  ask_before_acting: []

schedules:
  - name: release-due
    days: [mon]
    hours_utc: [6]
    brief_file: .dz/schedules/release-due.md
  - name: improve
    days: [mon]
    weeks_of_month: [1, 3] # the first and third Monday of the month
    hours_utc: [8]
    brief_file: .dz/schedules/improve.md

# Added by the developerz.ai maintainer agent: blocks from the current template this file did not have. Each states the value already in effect; edit it like any other key.

# branches: on at 60 because this file exists. A branch with no new commit
# this long is tagged archive/<branch>/<date> at its last commit, then deleted.
# false keeps every branch. See /docs/maintainer-yml.
branches:
  close_inactive_after_days: 60

# scout: the platform's daily survey of this repo files only what is already BROKEN
# (red CI, failing tests, a security advisory, a broken build or link) — never an
# improvement idea. `full` lets it file ideas too; `off` stops the survey.
scout:
  survey: broken_only

# devops: advisories for what npm users install (decision of record 2026-11-28; replaces a daily
# security schedule). care.docs_drift off: 47 tasks -> 8 docs-only merges, 33 failed over 30 days.
devops:
  watch: advisories

care:
  docs_drift: "off"
