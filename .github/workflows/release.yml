name: release

# Publishes the workspace packages to npm under the @developerz.ai scope using
# OIDC trusted publishing — no NPM_TOKEN secret. npm mints a short-lived token
# from the GitHub Actions id-token and verifies it against the trusted publisher
# configured for each package on npmjs.com. Provenance attestation is automatic.
#
# Prerequisites (one-time, per package, on npmjs.com):
#   1. The package must already exist on the registry (bootstrap the first
#      version manually — see README/PUBLISHING notes).
#   2. Package → Settings → Trusted Publisher → GitHub Actions:
#        Organization/user: developerz-ai
#        Repository:        ai-task-master
#        Workflow filename: release.yml
#        Environment:       (leave blank, or "npm" if you add one below)

on:
  release:
    types: [published]
  workflow_dispatch:

# Serialize releases, but NEVER cancel one mid-flight — npm publishes are
# irreversible, so cancel-in-progress must stay false (repo CI standard).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # REQUIRED for OIDC — lets npm mint a token from this run

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      # Pinned (not @latest): npm 11.6.x regressed the provenance path — a global
      # install lands without a resolvable `sigstore` module, so `npm publish`
      # with provenance dies on "Cannot find module 'sigstore'". 11.5.2 is the
      # last release before that regression and satisfies the trusted-publishing
      # minimum. Revisit when a fixed latest ships.
      - name: upgrade npm
        run: npm install -g npm@11.5.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      # Publish the dependency first: aitm pins @developerz.ai/ai-claude-compat to
      # an exact version, so that version must already be on the registry. Keep the
      # two package versions in lockstep when bumping.
      - name: publish ai-claude-compat
        run: npm publish -w @developerz.ai/ai-claude-compat

      - name: publish aitm
        run: npm publish -w @developerz.ai/aitm
