notes: "Decision #1 (oauth inbound-HTTP carve-out, slice 04): RFC 8252 loopback-only exception approved — allow http://127.0.0.1:PORT and http://[::1]:PORT for MCP OAuth redirects; remote inbound HTTP servers remain banned. Decision #2 (orchestrator agent-as-tool path, slice 07): DELETE — Orchestrator.build + subagent-tools.ts (~400 LOC) have zero production callers and have drifted; production uses WorkLoopOrchestrator port with direct finalizeCommit/openPr methods instead. Subagent-tools only used in tests. Decision #3 (templates, slice 04): DELETE HTML files, KEEP inline getDefaultHtml — src/templates/*.html are dead assets (never copied to dist because tsconfig.build.json only includes src/**/*.ts); inline fallback already correct. Decision #4 (dirty-tree guard, slice 01 step 1): REFUSE at run entry, opt out with `--allow-dirty` (CLI-only, never a config-file key) which restores the old discard-and-clean behaviour; no auto-stash — the refusal message points at `git stash -u` instead, so aitm never owns a stash the operator did not ask for. The refusal is typed (DirtyWorkingTree) and aborts the whole run rather than blocking each group. Decision #5 (run lock, slice 01 step 2): exclusive .ai-task-master/run.lock via open(wx) carrying {pid, host, startedAt, token}; acquired at run entry in runStart (covers resume) and runMergePr, released in try/finally. Stale locks are reclaimed automatically only when the recorded host is this machine AND kill(pid, 0) reports ESRCH — a holder on another host, or one that answers EPERM, is never stolen; no heartbeat (a crash-proof lock nobody can clear is worse than the race). release() only unlinks its own token, and cleanupOnSuccess() exempts run.lock so the holder alone drops it. Reclaim of a stale lock is itself serialized on a marker named for a fingerprint of the debris bytes (run.lock.reclaim-<hash>), created with the same open(wx): two runs judging the same dead holder would otherwise each unlink the other's replacement and both proceed, so exactly one process may clear a given record, and only while the bytes on disk still match the ones it judged dead — the loser refuses rather than loops, and a crash inside that window is recovered by the `rm run.lock` the refusal already prints. Decision #6 (init clobber guard, slice 01 step 3): StateStore.init refuses when state.json already exists, throwing typed StateAlreadyInitialized, unless the caller passes { force: true }; the probe is a plain check-then-atomicWrite, not create-exclusive, because run.lock already provides cross-process exclusion and a claim-first scheme would leave an empty state.json blocking the next start after a mid-init crash. Callers force only where a clobber is intended: runStart when a finished run is superseded or state.json is unparseable (a missing file needs no force), and merge-pr --no-resume (step 4 replaces that clobber with an in-place currentPr update). Decision #7 (merge-pr --no-resume, slice 01 step 4): UPDATE IN PLACE, do not refuse — the flag's contract is 'do not trust the persisted currentPr', so the re-resolved take-over PR is written through StateStore.update and the run keeps its plan, group stages, options, sessionCount and runId (refusing when prGroups is non-empty was the other option in the plan; it would make the flag unusable on exactly the runs it exists for). merge-pr no longer passes force at all: a missing state.json still synthesizes + init()s a take-over state, and a present-but-unreadable one is refused with the same 'fix or delete' exit as the resume path rather than being rewritten. Decision #8 (state schema versioning, slice 01 step 5): state.json carries schemaVersion, and state/migrations.ts lifts a file to CURRENT_SCHEMA_VERSION before RunStateSchema validates it — one step per version, keyed by the version it reads, replacing the four unconditional read-time coercions in state-store (coerceLegacyTasks/legacyTask/coerceLegacyStage/inferStage). v0 = the unversioned shape (string[] tasks, no PrGroup.stage); v1 = today's. A file whose version is newer than this build, or is not a version at all, is REFUSED (UnsupportedSchemaVersion), never rewritten — and that error deliberately does not carry the `<path>:` prefix that runStart's isMissingOrInvalidState reads as 'corrupt, safe to discard', which would otherwise force-init over a live run purely because it came from a newer aitm; commands.ts also excludes the error type explicitly rather than trusting the message shape. Consequence: coercion now runs only for v0 files, so an off-schema in-memory write (string tasks) fails validation at write time instead of being silently repaired on the next read — three integration fixtures that relied on that were corrected to real Task[]. Decision #9 (project bashRules, slice 02 step 1): TIGHTEN-ONLY, do not strip the field — a project config's `deny` rules are honored (a repo narrowing the model's shell is always safe and is the legitimate use of the key) but its `allow` rules are dropped + warned, since first-match-wins puts an early allow ahead of DEFAULT_BASH_RULES and would hand a cloned repo back `git push --force` / `gh pr merge` / `git reset --hard`. The surviving project denies are now MERGED in front of the global rules instead of replacing them wholesale — wholesale replacement was itself a widening vector (a repo could drop the operator's own denies just by declaring one rule of its own). Effective order: project denies < global rules < built-in defaults. Only the user-owned ~/.aitm.json can still allow-override a built-in deny (the issue #113 escape hatch). Full strip (matching hooks/formatCommand) was the other option in the plan; it was rejected because it also kills the safe, useful direction of the key. The allow-drop lives in ConfigLoader.stripProjectBashAllowRules, called from stripUntrustedProjectFields so project-scope sanitizing stays in one place. Raw audit reports in findings/."
