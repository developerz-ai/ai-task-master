<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorization Failed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }
    .container {
      text-align: center;
      padding: 3rem 2rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 480px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      color: #ef4444;
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    p {
      color: #6b7280;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    .error {
      padding: 1rem;
      background: #fef2f2;
      border-radius: 6px;
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      font-size: 0.875rem;
      color: #dc2626;
      border-left: 3px solid #ef4444;
      text-align: left;
      overflow-wrap: break-word;
    }
    .error-label {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">❌</div>
    <h1>Authorization Failed</h1>
    <p>The OAuth authorization could not be completed. Please try again.</p>
    <div class="error">
      <div class="error-label">Error:</div>
      <div>{{error}}</div>
      <div class="error-label" style="margin-top: 0.75rem;">Description:</div>
      <div>{{error_description}}</div>
    </div>
  </div>
</body>
</html>
