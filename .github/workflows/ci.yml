name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    name: bun (test + lint)
    # Blacksmith 2 vCPU runner — fast on small CI matrices, plenty for our test suite.
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install

      - name: lint
        run: bun run lint

      - name: typecheck
        run: bun run typecheck

      # No `bun test` here: the suite is authored against `node:test`, and Bun's
      # node:test shim mis-handles it when many files run together — an async test
      # in one file leaks context into the next, so Bun throws "test() inside
      # another test()" on top-level tests (oven-sh/bun#5090). It's ordering-
      # dependent and unfixable from our side. The `node` job below is the
      # authoritative test runner (full suite: src + test/integration). Bun still
      # guards install + lint + typecheck.

  node:
    name: node (test + lint)
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm install

      - name: lint
        run: npm run lint

      # Per-workspace (npm), so the Node job never shells out to bun — the root
      # typecheck/test:node scripts delegate via `bun run --filter`.
      - name: typecheck
        run: npm run typecheck --workspaces

      - name: test
        run: npm run test:node --workspaces
