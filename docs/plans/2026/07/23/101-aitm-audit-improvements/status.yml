notes: "Decision #1 (oauth inbound-HTTP carve-out, slice 04): RFC 8252 loopback-only exception approved — allow http://127.0.0.1:PORT and http://[::1]:PORT for MCP OAuth redirects; remote inbound HTTP servers remain banned. Decision #2 (orchestrator agent-as-tool path, slice 07): DELETE — Orchestrator.build + subagent-tools.ts (~400 LOC) have zero production callers and have drifted; production uses WorkLoopOrchestrator port with direct finalizeCommit/openPr methods instead. Subagent-tools only used in tests. Decision #3 (templates, slice 04): DELETE HTML files, KEEP inline getDefaultHtml — src/templates/*.html are dead assets (never copied to dist because tsconfig.build.json only includes src/**/*.ts); inline fallback already correct. Decision #4 (dirty-tree guard, slice 01 step 1): REFUSE at run entry, opt out with `--allow-dirty` (CLI-only, never a config-file key) which restores the old discard-and-clean behaviour; no auto-stash — the refusal message points at `git stash -u` instead, so aitm never owns a stash the operator did not ask for. The refusal is typed (DirtyWorkingTree) and aborts the whole run rather than blocking each group. Decision #5 (run lock, slice 01 step 2): exclusive .ai-task-master/run.lock via open(wx) carrying {pid, host, startedAt, token}; acquired at run entry in runStart (covers resume) and runMergePr, released in try/finally. Stale locks are reclaimed automatically only when the recorded host is this machine AND kill(pid, 0) reports ESRCH — a holder on another host, or one that answers EPERM, is never stolen; no heartbeat (a crash-proof lock nobody can clear is worse than the race). release() only unlinks its own token, and cleanupOnSuccess() exempts run.lock so the holder alone drops it. Reclaim of a stale lock is itself serialized on a marker named for a fingerprint of the debris bytes (run.lock.reclaim-<hash>), created with the same open(wx): two runs judging the same dead holder would otherwise each unlink the other's replacement and both proceed, so exactly one process may clear a given record, and only while the bytes on disk still match the ones it judged dead — the loser refuses rather than loops, and a crash inside that window is recovered by the `rm run.lock` the refusal already prints. Decision #6 (init clobber guard, slice 01 step 3): StateStore.init refuses when state.json already exists, throwing typed StateAlreadyInitialized, unless the caller passes { force: true }; the probe is a plain check-then-atomicWrite, not create-exclusive, because run.lock already provides cross-process exclusion and a claim-first scheme would leave an empty state.json blocking the next start after a mid-init crash. Callers force only where a clobber is intended: runStart when a finished run is superseded or state.json is unparseable (a missing file needs no force), and merge-pr --no-resume (step 4 replaces that clobber with an in-place currentPr update). Decision #7 (merge-pr --no-resume, slice 01 step 4): UPDATE IN PLACE, do not refuse — the flag's contract is 'do not trust the persisted currentPr', so the re-resolved take-over PR is written through StateStore.update and the run keeps its plan, group stages, options, sessionCount and runId (refusing when prGroups is non-empty was the other option in the plan; it would make the flag unusable on exactly the runs it exists for). merge-pr no longer passes force at all: a missing state.json still synthesizes + init()s a take-over state, and a present-but-unreadable one is refused with the same 'fix or delete' exit as the resume path rather than being rewritten. Decision #8 (state schema versioning, slice 01 step 5): state.json carries schemaVersion, and state/migrations.ts lifts a file to CURRENT_SCHEMA_VERSION before RunStateSchema validates it — one step per version, keyed by the version it reads, replacing the four unconditional read-time coercions in state-store (coerceLegacyTasks/legacyTask/coerceLegacyStage/inferStage). v0 = the unversioned shape (string[] tasks, no PrGroup.stage); v1 = today's. A file whose version is newer than this build, or is not a version at all, is REFUSED (UnsupportedSchemaVersion), never rewritten — and that error deliberately does not carry the `<path>:` prefix that runStart's isMissingOrInvalidState reads as 'corrupt, safe to discard', which would otherwise force-init over a live run purely because it came from a newer aitm; commands.ts also excludes the error type explicitly rather than trusting the message shape. Consequence: coercion now runs only for v0 files, so an off-schema in-memory write (string tasks) fails validation at write time instead of being silently repaired on the next read — three integration fixtures that relied on that were corrected to real Task[]. Decision #9 (project bashRules, slice 02 step 1): TIGHTEN-ONLY, do not strip the field — a project config's `deny` rules are honored (a repo narrowing the model's shell is always safe and is the legitimate use of the key) but its `allow` rules are dropped + warned, since first-match-wins puts an early allow ahead of DEFAULT_BASH_RULES and would hand a cloned repo back `git push --force` / `gh pr merge` / `git reset --hard`. The surviving project denies are now MERGED in front of the global rules instead of replacing them wholesale — wholesale replacement was itself a widening vector (a repo could drop the operator's own denies just by declaring one rule of its own). Effective order: project denies < global rules < built-in defaults. Only the user-owned ~/.aitm.json can still allow-override a built-in deny (the issue #113 escape hatch). Full strip (matching hooks/formatCommand) was the other option in the plan; it was rejected because it also kills the safe, useful direction of the key. The allow-drop lives in ConfigLoader.stripProjectBashAllowRules, called from stripUntrustedProjectFields so project-scope sanitizing stays in one place. Decision #10 (profile names, slice 02 step 2): REJECT the reserved names rather than support them as quoted keys — `__proto__`/`prototype`/`constructor` are refused by every ProfileManager command (assertProfileName, mirroring splitKey's FORBIDDEN_KEY_SEGMENTS check) and membership everywhere moved from `name in profiles` / `profiles[name]` to `Object.hasOwn`. Own-property lookup alone would have made an own `__proto__` key technically safe, but a profile whose name reads as a prototype member is a trap for every later consumer (and JSON round-trips of that key differ between parsers), so the name surface is closed instead. Before: `profile set __proto__ baseURL <url>` wrote onto Object.prototype in-process, `use __proto__`/`use constructor` passed the `in` guard and persisted a dangling activeProfile, and `add constructor` failed with a false 'already exists'. ConfigLoader.resolveActiveProfile got the same own-property guard so a config written before this fix resolves to the existing dangling-pointer warning instead of handing Object.prototype back as the active profile. Decision #11 (env-value scrubbing, slice 02 step 6): REGISTER LITERAL KEY VALUES at startup — logger/secret-registry.ts holds the exact provider keys this process was configured with, and scrubSecrets consults it before its shape patterns, so all three channels (logger, step-progress, error-reporter) are covered by construction through the one scrubber they already share rather than by three separate hooks. ConfigLoader.resolve is the collection point (the only module that reads the config files): env OPENROUTER_API_KEY, the global openrouterApiKey, and EVERY profile's key, not just the active one, since an inactive profile's key still reaches output via error messages or a mid-run switch. Project scope is deliberately excluded — its key is stripped upstream and never used, and registering an attacker-chosen literal would let a hostile repo blank arbitrary text out of the operator's logs. The registry is append-only for the process lifetime (a key that was live earlier must stay redacted in already-queued log lines and error events) and refuses values under 8 characters, so a placeholder or test stub cannot black out ordinary prose. Decision #12 (subagent cancellation, slice 03 / PR 6 step 1): AGENT-SCOPED signal — `SubagentInit.signal`/`ScoutAgentInit.signal` are forwarded into compat's `createSubagent` (new `SubagentConfig.signal`), which applies the signal to EVERY generate the agent makes, rather than threading it through each runner call. The per-call route was the other option; it cannot work for the Planner/Reviewer/scouts, whose generations are owned by `runWithSchemaRetry` (the caller never touches them), so it would have needed a second `signal` on `SchemaRetryOptions` plus registry reads in four runners to cover the same ground. Composition, not replacement: the run signal and a per-call `abortSignal` are merged through the existing `linkController` bridge (released once the call settles, so a run-scoped signal never accumulates listeners), and the configured per-step deadline stays armed — whichever fires first wins, and a cancel is still never relabelled a StepTimeoutError. Forwarding itself moved into ONE `forwardInit` helper: planner previously dropped `prepareStep` + `providerOptions` and reviewer dropped `providerOptions`, so a dial set at a create site was silently ignored per role. Decision #13 (editor-fanout cancellation, slice 03 / PR 6 step 2): PASS THE SIGNAL TWICE, from ONE expression per call site — `WorkerInput.signal` was a dead field, so a Ctrl-C stopped the Coordinator's generation while every editor leaf ran to completion (the leaves are raw `generateText` calls under the fanout's own AbortController, not agent steps, so `SubagentInit.signal` cannot reach them). The task path carries it through the `WorkLoopOrchestrator` port as `WorkerInvocation.signal` rather than having the adapter read its own `input.signal`: the WorkLoop is what owns run cancellation (its post-batch `signal?.aborted` check already claimed the abort reached in-flight LLM calls), and reading the adapter's copy would have left the port field just as dead one level up. The adapter falls back to `input.signal` when the invocation omits it, and uses that single `workerSignal` for BOTH the agent and the Worker input, so the two can never drift apart. The CI-fix, self-review and take-over sessions already held the run signal for their agent and now put it on their `WorkerInput` too. Decision #14 (loop-poll cancellation, slice 03 / PR 6 step 3): A CANCELLED POLL RETURNS A NON-VERDICT, callers re-check — `GitHubClient.waitForChecks(pr, signal?)` now takes the run signal (both `this.sleep` sites plus a `signal.aborted` check at the top of each poll iteration), and on abort returns `{ state: 'pending' }` rather than throwing. Throwing was the other option; it was rejected because the two existing catch sites already ascribe meaning to their errors (`CiFailed` → `--admin` force-advances to reviews, i.e. straight at the merge) and a third error type would have had to be excluded from each by hand. 'pending' is the honest answer — the poll never settled — but it is NOT a CI state, so every caller re-checks `signal.aborted` before branching: `handleWaitingCi` (else 'pending' reads as not-green → a persisted ci-failed stage a resume would 'fix' on a PR whose CI never failed), the take-over loop (else the fix Worker, Reviewer and force-push all run on a stopped run), and the prPerTask `autoMergeFlow` (else 'not failing' falls straight through to `gh pr merge`; it throws, since a silent return there records the group merged). Handlers signal a cancel by returning their CURRENT stage, never 'blocked': the group's persisted stage stays where it is, so a resume re-enters at the same point instead of needing a blocked state un-stuck, and `driveStages` checks the signal before dispatching ANY handler — the transitions past waiting-ci spend LLM calls or merge. Also threaded: the review grace (`StageDeps.sleep`), the take-over grace + cooldown, and `rebaseAndForcePush`, which refuses to start another AI conflict-resolution attempt on a cancelled run and aborts the half-applied rebase on the way out rather than leaving the operator's checkout mid-rebase. Raw audit reports in findings/."
